name: Verify source-based spectator rebuild
on:
  push:
    branches:
      - codex/source-fidelity-rebuild
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing simulator tests
        run: npm test
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: Archive preview build
        uses: actions/upload-artifact@v4
        with:
          name: reaper-war-spectator-source-preview
          path: dist
