name: Validate large-fleet renderer and reference screenshots
on:
  pull_request:
    branches: [main]
  push:
    branches: [perf/thousand-ship-battles]
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Headless simulation tests
        run: npm test
      - name: Typecheck and Vite production build
        run: npm run build
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Screenshot composition regression and controls
        run: npm run test:e2e -- e2e/graphics-reference.spec.ts e2e/expansion.spec.ts e2e/ship-references.spec.ts e2e/au-expansion.spec.ts
      - name: Upload before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-reference-screenshots
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
